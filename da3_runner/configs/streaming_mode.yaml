# Dynamic scene, streaming, 4 cameras.
# 15s @ 5fps × 4 cams = 300 frames -> chunk_size=80, overlap=40 (both /4).
dataset_dir: "/ws/shared/project-data/4DGT/ORIGINAL_2026.02.13_at_04.22.15_camera-mi_9060"
cameras: [front, right, left, rear]

fps_in: 30.0
fps_out: 5.0
duration_seconds: 15.0
start_seconds: 0.0

bumper_blackfill: true
bumper_rows: [1043, 1160]
process_res: 504
process_res_method: upper_bound_resize

mode: streaming
streaming_weights_dir: "./weights"

chunk_size: 80
overlap: 40
align_method: sim3
align_lib: torch
ref_view_strategy: saddle_balanced
loop_enable: false

# Streaming pointcloud merge — these are the big knobs for ply density.
pointcloud_sample_ratio: 0.015
pointcloud_conf_coef: 0.75

use_known_intrinsics: false

export_pointcloud: true
export_3dgs: false
export_3dgs_video: false

# Streaming TSDF post-processing (both run after streaming completes).
tsdf_per_chunk_streaming: true   # cleaner per-chunk pcd/{i}_pcd_tsdf.ply + combined_pcd_tsdf.ply
tsdf_global_streaming: true      # cross-chunk averaging into pointcloud_tsdf_global.ply
tsdf_voxel: 0.05
tsdf_trunc: 0.20
backproj_conf_percentile: 30.0

run_name: ""
output_root: ""        # empty = write to <dataset_dir>/DA3_output/<run_name>/
input_root: ""
