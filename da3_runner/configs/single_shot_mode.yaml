# Single-shot, 4 cameras, ~30 timestamps (120 frames total).
# Adopts the reference pipeline's high-quality post-proc: back-project + TSDF.
dataset_dir: "/ws/shared/project-data/4DGT/ORIGINAL_2026.02.05_at_06.41.13_camera-mi_9060"
cameras: [front, right, left, rear]

fps_in: 30.0
fps_out: 5.0           # 1 timestamp every 6 source frames
duration_seconds: 6.0  # -> 30 timestamps × 4 cams = 120 frames
start_seconds: 0.0

bumper_blackfill: true
bumper_rows: [1043, 1160]
process_res: 504
process_res_method: upper_bound_resize

mode: singleshot
model_dir: "depth-anything/DA3NESTED-GIANT-LARGE-1.1"

use_known_intrinsics: false
use_known_extrinsics: false   # set true ONLY for static scenes (assumes ego doesn't move) the script needs further modification for moving ego

# Outputs.
export_pointcloud: true            # back-projected, full-detail pointcloud.ply
export_glb: false                  # also write DA3's scene.glb (same model output, glTF container)
export_tsdf: true                  # fused pointcloud_tsdf.ply — THE quality bump
tsdf_voxel: 0.05
tsdf_trunc: 0.20
export_pointcloud_by_cam: true     # diagnostic per-cam tinted ply
backproj_downsample: 2
backproj_conf_percentile: 30.0
final_voxel: 0.0

run_name: ""
output_root: ""        # empty = write to <dataset_dir>/DA3_output/<run_name>/
input_root: ""
